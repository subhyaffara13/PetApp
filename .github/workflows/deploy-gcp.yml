name: Deploy to Google Cloud Run via GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_portals:
        description: 'Deploy revenue portals (clinic, store, admin) along with frontend/backend'
        required: true
        type: boolean
        default: true

env:
  REGION: ${{ secrets.GCP_REGION || 'europe-west1' }} # Default region: europe-west1
  GAR_REPO: petsos-repo
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # =============================================================
  # Step 1: Run Quality Checks & Unit Tests
  # =============================================================
  validate:
    name: Run Unit Tests & Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit Tests (30 Tests)
        working-directory: ./backend
        run: npm test

      - name: Compile NestJS Backend
        working-directory: ./backend
        run: npm run build

      - name: Compile React 19 Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # =============================================================
  # Step 2: Build & Deploy Backend API to Cloud Run
  # =============================================================
  deploy-backend:
    name: Deploy Backend API
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy-backend.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect GCP Project ID
        id: detect-project
        if: steps.auth.outcome == 'success'
        run: |
          PROJ="${{ steps.auth.outputs.project_id }}"
          if [ -z "$PROJ" ]; then
            SA_EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1)"
            [ -z "$SA_EMAIL" ] && SA_EMAIL="$(gcloud auth list --format='value(account)' | head -n1)"
            if [[ "$SA_EMAIL" =~ @(.*)\.iam\.gserviceaccount\.com ]]; then
              PROJ="${BASH_REMATCH[1]}"
            fi
          fi
          [ -z "$PROJ" ] && PROJ="$(gcloud config get-value project 2>/dev/null || true)"
          [ -z "$PROJ" ] && PROJ="${{ secrets.GCP_PROJECT_ID }}"
          
          echo "================================================="
          echo "Discovered GCP Project ID: '$PROJ'"
          echo "================================================="
          
          if [ -z "$PROJ" ]; then
            echo "::error::Could not determine GCP Project ID from service account credentials!"
            exit 1
          fi
          
          echo "project_id=$PROJ" >> $GITHUB_OUTPUT
          gcloud config set project "$PROJ"

      - name: Ensure Artifact Registry Repository Exists
        if: steps.auth.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          echo "Active project: $PROJ"
          gcloud config set project "$PROJ" --quiet || true

          echo "Verifying Artifact Registry repository ${{ env.GAR_REPO }}..."
          gcloud artifacts repositories describe ${{ env.GAR_REPO }} --location=${{ env.REGION }} --project="$PROJ" --quiet 2>&1
          if [ $? -ne 0 ]; then
            echo "Repository not found or error encountered; creating repository..."
            gcloud artifacts repositories create ${{ env.GAR_REPO }} \
              --repository-format=docker \
              --location=${{ env.REGION }} \
              --project="$PROJ" \
              --description="PetSOS Production Docker Images" \
              --quiet 2>&1 || true
          else
            echo "Repository ${{ env.GAR_REPO }} is ready."
          fi
          exit 0

      - name: Authorize Docker to Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |
          set +e
          echo "Configuring Docker auth for ${{ env.REGION }}-docker.pkg.dev..."
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet 2>&1
          echo "Direct oauth2accesstoken login fallback..."
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ env.REGION }}-docker.pkg.dev" || true
          exit 0

      - name: Build & Push Backend Container Image
        if: steps.auth.outcome == 'success'
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-api:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-api:latest"
          echo "Building backend Docker image: $IMAGE_TAG..."
          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" ./backend
          echo "Pushing $IMAGE_TAG..."
          docker push "$IMAGE_TAG"
          echo "Pushing $LATEST_TAG..."
          docker push "$LATEST_TAG"

      - name: Deploy Backend to Google Cloud Run
        id: deploy-backend
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: petapp
          image: ${{ env.REGION }}-docker.pkg.dev/${{ steps.detect-project.outputs.project_id }}/${{ env.GAR_REPO }}/petsos-api:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --min-instances=1
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --port=8080
          env_vars: |
            NODE_ENV=production
            PORT=8080
            USE_ATLAS=true
            MONGO_DB_CONNECTION_STRING=${{ secrets.MONGO_DB_CONNECTION_STRING }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=3d
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ADMIN_SECRET_TOKEN=${{ secrets.ADMIN_SECRET_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Verify Backend API Live Health Probe
        if: steps.auth.outcome == 'success'
        run: |
          BACKEND_URL="${{ steps.deploy-backend.outputs.url }}"
          echo "Pinging production backend at $BACKEND_URL/health..."
          curl -f --retry 6 --retry-delay 5 --retry-connrefused "$BACKEND_URL/health" || {
            echo "::error::Backend health check failed on $BACKEND_URL"
            exit 1
          }
          echo "Backend is alive and healthy!"

  # =============================================================
  # Step 3: Build & Deploy Customer Frontend to Cloud Run
  # =============================================================
  deploy-frontend:
    name: Deploy Customer Frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect GCP Project ID
        id: detect-project
        if: steps.auth.outcome == 'success'
        run: |
          PROJ="${{ steps.auth.outputs.project_id }}"
          if [ -z "$PROJ" ]; then
            SA_EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1)"
            [ -z "$SA_EMAIL" ] && SA_EMAIL="$(gcloud auth list --format='value(account)' | head -n1)"
            if [[ "$SA_EMAIL" =~ @(.*)\.iam\.gserviceaccount\.com ]]; then
              PROJ="${BASH_REMATCH[1]}"
            fi
          fi
          [ -z "$PROJ" ] && PROJ="$(gcloud config get-value project 2>/dev/null || true)"
          [ -z "$PROJ" ] && PROJ="${{ secrets.GCP_PROJECT_ID }}"
          
          echo "Discovered GCP Project ID: '$PROJ'"
          echo "project_id=$PROJ" >> $GITHUB_OUTPUT
          gcloud config set project "$PROJ"

      - name: Authorize Docker to Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |
          set +e
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet 2>&1
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ env.REGION }}-docker.pkg.dev" || true
          exit 0

      - name: Build & Push Frontend Image with Backend URL
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-frontend:${{ github.sha }}"
          LATEST_TAG="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-frontend:latest"
          
          # Inject production build-time env variables
          echo "VITE_API_URL=${VITE_API_URL}" >> ./frontend/.env
          echo "VITE_SOCKET_URL=${VITE_API_URL}" >> ./frontend/.env
          echo "VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}" >> ./frontend/.env
          echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" >> ./frontend/.env

          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" ./frontend
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"

      - name: Deploy Frontend to Google Cloud Run
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: petsos
          image: ${{ env.REGION }}-docker.pkg.dev/${{ steps.detect-project.outputs.project_id }}/${{ env.GAR_REPO }}/petsos-frontend:${{ github.sha }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --port=80

  # =============================================================
  # Step 4: Deploy Revenue Portals (Clinic, Store, Admin)
  # =============================================================
  deploy-portals:
    name: Deploy Revenue Portals
    needs: deploy-backend
    if: github.event_name == 'push' || github.event.inputs.deploy_portals == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect GCP Project ID
        id: detect-project
        if: steps.auth.outcome == 'success'
        run: |
          PROJ="${{ steps.auth.outputs.project_id }}"
          if [ -z "$PROJ" ]; then
            SA_EMAIL="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' 2>/dev/null | head -n1)"
            [ -z "$SA_EMAIL" ] && SA_EMAIL="$(gcloud auth list --format='value(account)' | head -n1)"
            if [[ "$SA_EMAIL" =~ @(.*)\.iam\.gserviceaccount\.com ]]; then
              PROJ="${BASH_REMATCH[1]}"
            fi
          fi
          [ -z "$PROJ" ] && PROJ="$(gcloud config get-value project 2>/dev/null || true)"
          [ -z "$PROJ" ] && PROJ="${{ secrets.GCP_PROJECT_ID }}"
          
          echo "Discovered GCP Project ID: '$PROJ'"
          echo "project_id=$PROJ" >> $GITHUB_OUTPUT
          gcloud config set project "$PROJ"

      - name: Authorize Docker
        if: steps.auth.outcome == 'success'
        run: |
          set +e
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet 2>&1
          gcloud auth print-access-token | docker login -u oauth2accesstoken --password-stdin "https://${{ env.REGION }}-docker.pkg.dev" || true
          exit 0

      # 4a. Clinic Portal
      - name: Build & Deploy Clinic Portal
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          echo "VITE_API_URL=${VITE_API_URL}" >> ./clinic-portal/.env
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-clinic-portal:${{ github.sha }}"
          docker build -t "$IMAGE" ./clinic-portal
          docker push "$IMAGE"
          gcloud run deploy petsos-clinic-portal \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project "$PROJ" \
            --platform managed \
            --allow-unauthenticated \
            --port 80

      # 4b. Store Merchant Portal
      - name: Build & Deploy Store Portal
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          echo "VITE_API_URL=${VITE_API_URL}" >> ./store-portal/.env
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-store-portal:${{ github.sha }}"
          docker build -t "$IMAGE" ./store-portal
          docker push "$IMAGE"
          gcloud run deploy petsos-store-portal \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project "$PROJ" \
            --platform managed \
            --allow-unauthenticated \
            --port 80

      # 4c. Admin Portal
      - name: Build & Deploy Admin Portal
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          echo "VITE_API_URL=${VITE_API_URL}" >> ./Admin-Portal/.env
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-admin-portal:${{ github.sha }}"
          docker build -t "$IMAGE" ./Admin-Portal
          docker push "$IMAGE"
          gcloud run deploy petsos-admin-portal \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project "$PROJ" \
            --platform managed \
            --allow-unauthenticated \
            --port 80
