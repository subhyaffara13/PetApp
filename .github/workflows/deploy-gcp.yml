name: Deploy to Google Cloud Run via GitHub

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_portals:
        description: 'Deploy revenue portals (clinic, store, admin) along with frontend/backend'
        required: true
        type: boolean
        default: true

env:
  REGION: europe-west1
  GAR_REPO: petsos-repo
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  # =============================================================
  # Step 1: Run Quality Checks & Unit Tests
  # =============================================================
  validate:
    name: Run Unit Tests & Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Backend Unit Tests (30 Tests)
        working-directory: ./backend
        run: npm test

      - name: Compile NestJS Backend
        working-directory: ./backend
        run: npm run build

      - name: Compile React 19 Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  # =============================================================
  # Step 2: Build & Deploy Backend API to Cloud Run
  # =============================================================
  deploy-backend:
    name: Deploy Backend API
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      backend_url: ${{ steps.deploy-backend.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect GCP Project ID and Repo Region
        id: detect-project
        if: steps.auth.outcome == 'success'
        run: |
          node -e '
            const fs = require("fs");
            const cp = require("child_process");
            let proj = "";

            // 1. Read directly from downloaded credentials file
            const credPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
            if (credPath && fs.existsSync(credPath)) {
              try {
                const cred = JSON.parse(fs.readFileSync(credPath, "utf8"));
                proj = cred.project_id || cred.quota_project_id || "";
              } catch (e) {}
            }

            // 2. Fallback to auth action output
            if (!proj || proj === "(unset)") {
              const authOut = "${{ steps.auth.outputs.project_id }}".trim();
              if (authOut && authOut !== "(unset)") proj = authOut;
            }

            // 3. Fallback to active service account email domain
            if (!proj || proj === "(unset)") {
              try {
                const sa = cp.execSync("gcloud auth list --filter=status:ACTIVE --format=\"value(account)\"", { encoding: "utf8" }).trim();
                if (sa && sa !== "(unset)" && sa.includes("@") && sa.includes(".iam.gserviceaccount.com")) {
                  proj = sa.split("@")[1].replace(".iam.gserviceaccount.com", "");
                }
              } catch (e) {}
            }

            // 4. Fallback to gcloud config
            if (!proj || proj === "(unset)") {
              try {
                const p = cp.execSync("gcloud config get-value project", { encoding: "utf8" }).trim();
                if (p && p !== "(unset)") proj = p;
              } catch (e) {}
            }

            // 5. Fallback to secret
            if (!proj || proj === "(unset)") {
              const sec = "${{ secrets.GCP_PROJECT_ID }}".trim();
              if (sec && sec !== "(unset)") proj = sec;
            }

            console.log("DETECTED GCP PROJECT ID:", proj);
            if (!proj || proj === "(unset)") {
              console.error("::error::Could not determine GCP Project ID from service account credentials!");
              process.exit(1);
            }

            // Detect existing Artifact Registry location for petsos-repo
            let garRegion = "";
            try {
              const listOut = cp.execSync("gcloud artifacts repositories list --project=" + proj + " --format=\"value(name,LOCATION)\"", { encoding: "utf8" }).trim();
              console.log("Existing Repositories:\n" + listOut);
              const lines = listOut.split("\n");
              for (const line of lines) {
                if (line.includes("petsos-repo")) {
                  const parts = line.trim().split(/\s+/);
                  if (parts.length >= 2) {
                    garRegion = parts[parts.length - 1];
                    break;
                  }
                }
              }
            } catch (e) {
              console.log("Repo search notice:", e.message);
            }

            if (!garRegion) {
              garRegion = "${{ env.REGION }}";
            }
            console.log("TARGET GAR REGION:", garRegion);

            fs.appendFileSync(process.env.GITHUB_OUTPUT, "project_id=" + proj + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "gar_region=" + garRegion + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "GCP_PROJECT_ID=" + proj + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "GAR_REGION=" + garRegion + "\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, "### Detected GCP Project ID: `" + proj + "`\n### Target Artifact Registry Region: `" + garRegion + "`\n");
            try { cp.execSync("gcloud config set project " + proj, { stdio: "inherit" }); } catch (e) {}
          '

      - name: Ensure Artifact Registry Repository Exists
        if: steps.auth.outcome == 'success'
        run: |
          set +e
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          [ -z "$PROJ" ] && PROJ="$GCP_PROJECT_ID"
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"

          echo "Verifying Artifact Registry repository ${{ env.GAR_REPO }} in location $REG..."
          gcloud artifacts repositories describe ${{ env.GAR_REPO }} --location="$REG" --project="$PROJ" 2>&1
          if [ $? -ne 0 ]; then
            echo "Creating repository ${{ env.GAR_REPO }} in $REG..."
            gcloud artifacts repositories create ${{ env.GAR_REPO }} \
              --repository-format=docker \
              --location="$REG" \
              --project="$PROJ" \
              --description="PetSOS Production Docker Images" 2>&1 || true
          else
            echo "Repository ${{ env.GAR_REPO }} already exists in $REG."
          fi
          exit 0

      - name: Authorize Docker to Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"
          echo "Configuring Docker auth for $REG-docker.pkg.dev..."
          gcloud auth configure-docker "$REG-docker.pkg.dev" --quiet 2>&1 || true
          TOKEN="$(gcloud auth print-access-token 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$REG-docker.pkg.dev" || true
          fi
          exit 0

      - name: Build & Push Backend Container Image
        id: build-backend
        if: steps.auth.outcome == 'success'
        run: |
          set +e
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          [ -z "$PROJ" ] && PROJ="$GCP_PROJECT_ID"
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"

          if [ -z "$PROJ" ] || [ "$PROJ" = "true" ] || [ "$PROJ" = "(unset)" ]; then
            echo "::error::Project ID is unset or invalid: '$PROJ'"
            exit 1
          fi

          IMAGE_TAG="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-api:${{ github.sha }}"
          LATEST_TAG="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-api:latest"
          echo "Target image tag: $IMAGE_TAG"

          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" ./backend 2>&1 | tee /tmp/build_backend.log
          BUILD_CODE=${PIPESTATUS[0]}
          if [ $BUILD_CODE -ne 0 ]; then
            BUILD_ERR=$(tail -n 5 /tmp/build_backend.log | tr '\n' ' | ')
            echo "::error title=Docker Build Failed::$BUILD_ERR"
            exit $BUILD_CODE
          fi

          echo "Pushing $IMAGE_TAG..."
          docker push "$IMAGE_TAG" 2>&1 | tee /tmp/push_backend.log
          PUSH_CODE=${PIPESTATUS[0]}
          if [ $PUSH_CODE -ne 0 ]; then
            PUSH_ERR=$(tail -n 8 /tmp/push_backend.log | tr '\n' ' | ')
            echo "::error title=Docker Push Failed::$PUSH_ERR"
            exit $PUSH_CODE
          fi

          docker push "$LATEST_TAG" || true
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "Backend container built and pushed successfully!"
          exit 0

      - name: Deploy Backend to Google Cloud Run
        id: deploy-backend
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: petapp
          image: ${{ steps.build-backend.outputs.image }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --min-instances=1
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --port=8080
          env_vars: |
            NODE_ENV=production
            USE_ATLAS=true
            MONGO_DB_CONNECTION_STRING=${{ secrets.MONGO_DB_CONNECTION_STRING }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_REFRESH_EXPIRES_IN=3d
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
            ADMIN_SECRET_TOKEN=${{ secrets.ADMIN_SECRET_TOKEN }}
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}

      - name: Verify Backend API Live Health Probe
        if: steps.auth.outcome == 'success'
        run: |
          BACKEND_URL="${{ steps.deploy-backend.outputs.url }}"
          echo "Pinging production backend at $BACKEND_URL/health..."
          curl -f --retry 6 --retry-delay 5 --retry-connrefused "$BACKEND_URL/health" || {
            echo "::error::Backend health check failed on $BACKEND_URL"
            exit 1
          }
          echo "Backend is alive and healthy!"

  # =============================================================
  # Step 3: Build & Deploy Customer Frontend to Cloud Run
  # =============================================================
  deploy-frontend:
    name: Deploy Customer Frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect GCP Project ID and Repo Region
        id: detect-project
        if: steps.auth.outcome == 'success'
        run: |
          node -e '
            const fs = require("fs");
            const cp = require("child_process");
            let proj = "";

            const credPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
            if (credPath && fs.existsSync(credPath)) {
              try {
                const cred = JSON.parse(fs.readFileSync(credPath, "utf8"));
                proj = cred.project_id || cred.quota_project_id || "";
              } catch (e) {}
            }

            if (!proj || proj === "(unset)") {
              const authOut = "${{ steps.auth.outputs.project_id }}".trim();
              if (authOut && authOut !== "(unset)") proj = authOut;
            }

            if (!proj || proj === "(unset)") {
              try {
                const sa = cp.execSync("gcloud auth list --filter=status:ACTIVE --format=\"value(account)\"", { encoding: "utf8" }).trim();
                if (sa && sa !== "(unset)" && sa.includes("@") && sa.includes(".iam.gserviceaccount.com")) {
                  proj = sa.split("@")[1].replace(".iam.gserviceaccount.com", "");
                }
              } catch (e) {}
            }

            if (!proj || proj === "(unset)") {
              try {
                const p = cp.execSync("gcloud config get-value project", { encoding: "utf8" }).trim();
                if (p && p !== "(unset)") proj = p;
              } catch (e) {}
            }

            if (!proj || proj === "(unset)") {
              const sec = "${{ secrets.GCP_PROJECT_ID }}".trim();
              if (sec && sec !== "(unset)") proj = sec;
            }

            if (!proj || proj === "(unset)") {
              console.error("::error::Could not determine GCP Project ID!");
              process.exit(1);
            }

            let garRegion = "";
            try {
              const listOut = cp.execSync("gcloud artifacts repositories list --project=" + proj + " --format=\"value(name,LOCATION)\"", { encoding: "utf8" }).trim();
              const lines = listOut.split("\n");
              for (const line of lines) {
                if (line.includes("petsos-repo")) {
                  const parts = line.trim().split(/\s+/);
                  if (parts.length >= 2) {
                    garRegion = parts[parts.length - 1];
                    break;
                  }
                }
              }
            } catch (e) {}

            if (!garRegion) garRegion = "${{ env.REGION }}";

            fs.appendFileSync(process.env.GITHUB_OUTPUT, "project_id=" + proj + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "gar_region=" + garRegion + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "GCP_PROJECT_ID=" + proj + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "GAR_REGION=" + garRegion + "\n");
            try { cp.execSync("gcloud config set project " + proj, { stdio: "inherit" }); } catch (e) {}
          '

      - name: Authorize Docker to Artifact Registry
        if: steps.auth.outcome == 'success'
        run: |
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"
          gcloud auth configure-docker "$REG-docker.pkg.dev" --quiet 2>&1 || true
          TOKEN="$(gcloud auth print-access-token 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$REG-docker.pkg.dev" || true
          fi
          exit 0

      - name: Build & Push Frontend Image with Backend URL
        id: build-frontend
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          [ -z "$PROJ" ] && PROJ="$GCP_PROJECT_ID"
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"

          IMAGE_TAG="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-frontend:${{ github.sha }}"
          LATEST_TAG="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-frontend:latest"
          
          # Inject production build-time env variables
          echo "VITE_API_URL=${VITE_API_URL}" >> ./frontend/.env
          echo "VITE_SOCKET_URL=${VITE_API_URL}" >> ./frontend/.env
          echo "VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}" >> ./frontend/.env
          echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}" >> ./frontend/.env

          docker build -t "$IMAGE_TAG" -t "$LATEST_TAG" ./frontend
          docker push "$IMAGE_TAG"
          docker push "$LATEST_TAG"
          echo "image=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy Frontend to Google Cloud Run
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: petsos
          image: ${{ steps.build-frontend.outputs.image }}
          region: ${{ env.REGION }}
          flags: |
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --port=8080

  # =============================================================
  # Step 4: Deploy Revenue Portals (Clinic, Store, Admin)
  # =============================================================
  deploy-portals:
    name: Deploy Revenue Portals
    needs: deploy-backend
    if: github.event_name == 'push' || github.event.inputs.deploy_portals == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: steps.auth.outcome == 'success'
        uses: google-github-actions/setup-gcloud@v2

      - name: Detect GCP Project ID and Repo Region
        id: detect-project
        if: steps.auth.outcome == 'success'
        run: |
          node -e '
            const fs = require("fs");
            const cp = require("child_process");
            let proj = "";

            const credPath = process.env.GOOGLE_APPLICATION_CREDENTIALS;
            if (credPath && fs.existsSync(credPath)) {
              try {
                const cred = JSON.parse(fs.readFileSync(credPath, "utf8"));
                proj = cred.project_id || cred.quota_project_id || "";
              } catch (e) {}
            }

            if (!proj || proj === "(unset)") {
              const authOut = "${{ steps.auth.outputs.project_id }}".trim();
              if (authOut && authOut !== "(unset)") proj = authOut;
            }

            if (!proj || proj === "(unset)") {
              try {
                const sa = cp.execSync("gcloud auth list --filter=status:ACTIVE --format=\"value(account)\"", { encoding: "utf8" }).trim();
                if (sa && sa !== "(unset)" && sa.includes("@") && sa.includes(".iam.gserviceaccount.com")) {
                  proj = sa.split("@")[1].replace(".iam.gserviceaccount.com", "");
                }
              } catch (e) {}
            }

            if (!proj || proj === "(unset)") {
              try {
                const p = cp.execSync("gcloud config get-value project", { encoding: "utf8" }).trim();
                if (p && p !== "(unset)") proj = p;
              } catch (e) {}
            }

            if (!proj || proj === "(unset)") {
              const sec = "${{ secrets.GCP_PROJECT_ID }}".trim();
              if (sec && sec !== "(unset)") proj = sec;
            }

            if (!proj || proj === "(unset)") {
              console.error("::error::Could not determine GCP Project ID!");
              process.exit(1);
            }

            let garRegion = "";
            try {
              const listOut = cp.execSync("gcloud artifacts repositories list --project=" + proj + " --format=\"value(name,LOCATION)\"", { encoding: "utf8" }).trim();
              const lines = listOut.split("\n");
              for (const line of lines) {
                if (line.includes("petsos-repo")) {
                  const parts = line.trim().split(/\s+/);
                  if (parts.length >= 2) {
                    garRegion = parts[parts.length - 1];
                    break;
                  }
                }
              }
            } catch (e) {}

            if (!garRegion) garRegion = "${{ env.REGION }}";

            fs.appendFileSync(process.env.GITHUB_OUTPUT, "project_id=" + proj + "\n");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "gar_region=" + garRegion + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "GCP_PROJECT_ID=" + proj + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "GAR_REGION=" + garRegion + "\n");
            try { cp.execSync("gcloud config set project " + proj, { stdio: "inherit" }); } catch (e) {}
          '

      - name: Authorize Docker
        if: steps.auth.outcome == 'success'
        run: |
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"
          gcloud auth configure-docker "$REG-docker.pkg.dev" --quiet 2>&1 || true
          TOKEN="$(gcloud auth print-access-token 2>/dev/null || true)"
          if [ -n "$TOKEN" ]; then
            echo "$TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$REG-docker.pkg.dev" || true
          fi
          exit 0

      # 4a. Clinic Portal
      - name: Build & Deploy Clinic Portal
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          [ -z "$PROJ" ] && PROJ="$GCP_PROJECT_ID"
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"

          echo "VITE_API_URL=${VITE_API_URL}" >> ./clinic-portal/.env
          IMAGE="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-clinic-portal:${{ github.sha }}"
          docker build -t "$IMAGE" ./clinic-portal
          docker push "$IMAGE"
          gcloud run deploy petsos-clinic-portal \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project "$PROJ" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080

      # 4b. Store Merchant Portal
      - name: Build & Deploy Store Portal
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          [ -z "$PROJ" ] && PROJ="$GCP_PROJECT_ID"
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"

          echo "VITE_API_URL=${VITE_API_URL}" >> ./store-portal/.env
          IMAGE="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-store-portal:${{ github.sha }}"
          docker build -t "$IMAGE" ./store-portal
          docker push "$IMAGE"
          gcloud run deploy petsos-store-portal \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project "$PROJ" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080

      # 4c. Admin Portal
      - name: Build & Deploy Admin Portal
        if: steps.auth.outcome == 'success'
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.backend_url }}
        run: |
          PROJ="${{ steps.detect-project.outputs.project_id }}"
          [ -z "$PROJ" ] && PROJ="$GCP_PROJECT_ID"
          REG="${{ steps.detect-project.outputs.gar_region }}"
          [ -z "$REG" ] && REG="$GAR_REGION"
          [ -z "$REG" ] && REG="${{ env.REGION }}"

          echo "VITE_API_URL=${VITE_API_URL}" >> ./Admin-Portal/.env
          IMAGE="$REG-docker.pkg.dev/${PROJ}/${{ env.GAR_REPO }}/petsos-admin-portal:${{ github.sha }}"
          docker build -t "$IMAGE" ./Admin-Portal
          docker push "$IMAGE"
          gcloud run deploy petsos-admin-portal \
            --image "$IMAGE" \
            --region ${{ env.REGION }} \
            --project "$PROJ" \
            --platform managed \
            --allow-unauthenticated \
            --port 8080
