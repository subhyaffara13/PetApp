# =================================================================
# Google Cloud Build — PetSOS Multi-Service CI/CD Deployment
# Builds container images and deploys to Google Cloud Run
# =================================================================

steps:
  # 1. Build and push NestJS Backend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/petsos-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/petsos-api:latest'
      - './backend'
    id: 'build-backend'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/petsos-api:$COMMIT_SHA']
    id: 'push-backend'

  # 2. Deploy Backend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'petsos-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/petsos-api:$COMMIT_SHA'
      - '--region'
      - 'me-west1' # Tel Aviv / Middle East region (or us-central1)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '1'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
    id: 'deploy-backend'

  # 3. Build & push Customer Frontend
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/petsos-frontend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/petsos-frontend:latest'
      - './frontend'
    id: 'build-frontend'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/petsos-frontend:$COMMIT_SHA']
    id: 'push-frontend'

  # 4. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'petsos-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/petsos-frontend:$COMMIT_SHA'
      - '--region'
      - 'me-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
    id: 'deploy-frontend'

images:
  - 'gcr.io/$PROJECT_ID/petsos-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/petsos-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
