# ============================================================================
# PetSOS — nginx reference configuration (IP:port deployment, no domain)
#
# Serves 4 statically-built SPAs and reverse-proxies the NestJS API on a
# single IPv4 host. Build each SPA first (npm run build), then point the
# `root` directives at their `dist` folders.
#
# Layout assumed:
#   frontend (customer)  -> port 5173
#   store-portal         -> port 5174
#   clinic-portal        -> port 5175
#   Admin-Portal         -> port 5176
#   backend API          -> 127.0.0.1:3000
#
# Both the API and the web traffic terminate on the same public IP. The
# customer SPA serves on `/` and proxies known backend routes to port 3000.
# Each portal listens on its own port to avoid path collisions.
# ============================================================================

upstream petsos_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Map of backend route prefixes the SPAs call directly (no /api prefix).
map $uri $api_backend {
    ~^/(pet-profile|auth|marketplace|delivery|community|admin|clinic)  api;
    ~^/(emergency|store-portal|stores|shops|wolt|uber|health|upload)   api;
    default                          spa;
}

# ---------------- Customer Frontend + API (port 80) -----------------------
server {
    listen 80;
    server_name _;

    root /var/www/petsos/frontend/dist;
    index index.html;

    # Health check endpoint that also lets orchestrators verify the API.
    location = /health {
        proxy_pass http://petsos_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Backend API routes.
    location ~ ^/(pet-profile|auth|marketplace|delivery|community|admin|clinic|emergency|store-portal|stores|shops|wolt|uber|upload)(/|$) {
        proxy_pass http://petsos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # SPA fallback (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static caching.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}

# ---------------- Store Portal (port 5174) --------------------------------
server {
    listen 5174;
    server_name _;
    root /var/www/petsos/store-portal/dist;
    index index.html;

    location ~ ^/(store-portal|stores|emergency)(/|$) {
        proxy_pass http://petsos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------- Clinic Portal (port 5175) -------------------------------
server {
    listen 5175;
    server_name _;
    root /var/www/petsos/clinic-portal/dist;
    index index.html;

    location ~ ^/(clinic|emergency|courier)(/|$) {
        proxy_pass http://petsos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------- Admin Portal (port 5176) --------------------------------
server {
    listen 5176;
    server_name _;
    root /var/www/petsos/admin-portal/dist;
    index index.html;

    location ~ ^/(admin)(/|$) {
        proxy_pass http://petsos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
